<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Promo Payday</title>
<style>
  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent !important;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .countdown-wrapper {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 9999;
  }

  .countdown {
    position: relative;
    width: 140px;
    box-sizing: border-box;
    background: #d81f26;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding: 4px 0;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    text-align: center;
  }

  /* Angka waktu tetap di tengah persis */
  .time {
    display: inline-block;
  }

  /* Jam pasir di kiri, tidak menggeser angka */
  .hourglass {
    position: absolute;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    line-height: 1;
    animation: flip 3.8s ease-in-out infinite;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
    user-select: none;
  }

  @keyframes flip {
    0%, 42%   { transform: translateY(-50%) rotate(0deg); }
    50%       { transform: translateY(-50%) rotate(180deg); }
    58%, 100% { transform: translateY(-50%) rotate(360deg); }
  }
</style>
</head>
<body>
<div id="countdown-wrapper" class="countdown-wrapper">
  <div id="countdown" class="countdown">
    <span class="hourglass">⏳</span>
    <span id="time" class="time">00:00:00</span>
  </div>
</div>

<script> 
(function() { 
  const timeEl = document.getElementById("time"); 
 
  const THREE_HOURS = 3 * 60 * 60 * 1000; 
  const STORAGE_KEY = "tempo_countdown_end"; 
 
  let endTime = localStorage.getItem(STORAGE_KEY); 
 
  if (!endTime) { 
    endTime = Date.now() + THREE_HOURS; 
    localStorage.setItem(STORAGE_KEY, endTime); 
  } else { 
    endTime = parseInt(endTime); 
  } 
 
  function updateCountdown() { 
    const remaining = endTime - Date.now(); 
 
    if (remaining <= 0) { 
      endTime = Date.now() + THREE_HOURS; 
      localStorage.setItem(STORAGE_KEY, endTime); 
    } 
 
    const totalSeconds = Math.max(0, Math.floor((endTime - Date.now()) / 1000)); 
 
    const hours = Math.floor(totalSeconds / 3600); 
    const minutes = Math.floor((totalSeconds % 3600) / 60); 
    const seconds = totalSeconds % 60; 
 
    const pad = (n) => n.toString().padStart(2, "0"); 
 
    timeEl.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`; 
  } 
 
  updateCountdown(); 
  setInterval(updateCountdown, 1000); 
})(); 
</script>
</body>
</html>
